name: NSE Daily Scanner

on:
  schedule:
    - cron: '5 0 28 5 *'   # 7:05 PM CDT tonight (00:05 UTC May 28)
    - cron: '15 0 28 5 *'  # 7:15 PM CDT tonight (00:15 UTC May 28)
    - cron: '0 22 * * 1-5' # 5:00 PM CDT Mon-Fri permanent (22:00 UTC)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  issues: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show installed package versions
        run: pip show yfinance pandas numpy psycopg2-binary | grep -E 'Name|Version'

      - name: Syntax check all Python files
        run: python -m py_compile config.py data_loader.py indicators.py zones.py strategy.py lifecycle.py repository.py notifier.py universe.py main.py db_check.py && echo "All files OK"

      - name: Test imports (dry run)
        run: |
          python - <<'EOF'
          import sys
          print(f"Python {sys.version}")
          print("Testing imports...")
          try:
              import pandas; print(f"  pandas {pandas.__version__} OK")
              import numpy; print(f"  numpy {numpy.__version__} OK")
              import yfinance; print(f"  yfinance {yfinance.__version__} OK")
              import psycopg2; print(f"  psycopg2 {psycopg2.__version__} OK")
              from dotenv import load_dotenv; print(f"  python-dotenv OK")
          except Exception as e:
              print(f"  IMPORT FAILED: {e}")
              sys.exit(1)
          print("All library imports OK")
          EOF

      - name: Validate secrets
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All required secrets present."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check DB and init schema
        run: python db_check.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run scanner
        run: python main.py
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-log-${{ github.run_id }}
          path: scanner.log
          if-no-files-found: warn
          retention-days: 30
