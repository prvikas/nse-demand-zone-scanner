name: NSE Daily Scanner

on:
  schedule:
    # Runs at 04:00 UTC = 09:30 IST (after NSE previous day data is available)
    - cron: '0 4 * * 1-5'   # Monday–Friday only
  workflow_dispatch:          # Allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secrets are set
        run: |
          missing=""
          [ -z "$DATABASE_URL" ]       && missing="$missing DATABASE_URL"
          [ -z "$EMAIL_USER" ]         && missing="$missing EMAIL_USER"
          [ -z "$EMAIL_APP_PASSWORD" ] && missing="$missing EMAIL_APP_PASSWORD"
          [ -z "$EMAIL_TO" ]           && missing="$missing EMAIL_TO"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Please add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All required secrets are present."
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          EMAIL_USER:         ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}

      - name: Check DB connection and init schema
        run: |
          set -euo pipefail
          echo "--- Checking DB connection and initialising schema ---"
          python db_check.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run scanner
        run: |
          set -euo pipefail
          python main.py 2>&1 | tee scanner.log
          exit ${PIPESTATUS[0]}
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          EMAIL_USER:         ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-log-${{ github.run_id }}
          path: scanner.log
          if-no-files-found: warn
          retention-days: 30
